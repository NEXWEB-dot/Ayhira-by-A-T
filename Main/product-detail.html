<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ayhira by A&T — Premium Product Details">
  <meta name="theme-color" content="#2A231E">

  <title>Product Detail - Ayhira by A&T</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Custom styles for product detail page */
    .product-detail-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      margin-top: 2rem;
      margin-bottom: 6rem;
    }
    
    @media (max-width: 992px) {
      .product-detail-container {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }
    
    .product-gallery {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .swiper {
      width: 100%;
      aspect-ratio: 3/4;
      background-color: var(--color-surface);
    }
    
    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .product-info {
      display: flex;
      flex-direction: column;
    }
    
    .product-info .category {
      font-family: var(--font-primary);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.8rem;
      color: var(--color-text-light);
      margin-bottom: 0.5rem;
    }
    
    .product-info h1 {
      font-family: var(--font-secondary);
      font-size: 2.5rem;
      font-weight: 400;
      margin-bottom: 1rem;
      color: var(--color-text);
    }
    
    .product-info .price {
      font-family: var(--font-primary);
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: var(--color-text);
    }
    
    .product-info .description {
      font-family: var(--font-primary);
      font-size: 1rem;
      line-height: 1.6;
      color: var(--color-text-light);
      margin-bottom: 2rem;
      white-space: pre-wrap;
    }
    
    .product-options {
      margin-bottom: 2rem;
    }
    
    .product-options h4 {
      font-family: var(--font-primary);
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .color-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .color-chip {
      padding: 0.5rem 1rem;
      border: 1px solid var(--color-border);
      background: transparent;
      font-family: var(--font-primary);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .color-chip:hover, .color-chip.active {
      border-color: var(--color-text);
      background: var(--color-text);
      color: var(--color-white);
    }
    
    .add-to-cart-large {
      padding: 1rem 2rem;
      background-color: var(--color-text);
      color: var(--color-white);
      border: none;
      font-family: var(--font-primary);
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    
    .add-to-cart-large:hover {
      background-color: var(--color-gold);
    }
    
    .skeleton {
      background: linear-gradient(90deg, var(--color-surface) 25%, #e0e0e0 50%, var(--color-surface) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 4px;
    }
    
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar" id="announcement-bar">
    <span>Free Delivery on Orders Above Rs 6,000 &nbsp;✦&nbsp; Premium 3-Piece Embroidered Suits</span>
  </div>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header-inner">
      <!-- Mobile Menu Toggle -->
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Logo -->
      <div class="logo">
        <a href="/" id="logo-link">
          <span class="logo-main">AYHIRA</span>
          <span class="logo-sub">by A&amp;T</span>
        </a>
      </div>

      <!-- Navigation -->
      <nav class="nav-main" id="nav-main" role="navigation" aria-label="Main navigation">
        <a href="shop.html" id="nav-shop">Shop</a>
        <a href="#" id="nav-embroidered">Embroidered</a>
        <a href="#" id="nav-contact">Contact</a>
      </nav>

      <!-- Header Actions -->
      <div class="header-actions">
        <button class="header-action-btn" id="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
        <button class="header-action-btn" id="account-btn" aria-label="Account">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
        <button class="header-action-btn" id="cart-btn" aria-label="Shopping bag">
          <svg viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="cart-count" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Breadcrumb -->
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span>/</span>
      <a href="shop.html">Shop</a>
      <span>/</span>
      <span id="breadcrumb-product-name">Loading...</span>
    </nav>

    <!-- Product Detail Container -->
    <div class="product-detail-container">
      
      <!-- Left: Gallery -->
      <div class="product-gallery">
        <div class="swiper mySwiper">
          <div class="swiper-wrapper" id="product-gallery-wrapper">
            <!-- Skeleton Loader -->
            <div class="swiper-slide skeleton" style="height: 100%;"></div>
          </div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
      
      <!-- Right: Info -->
      <div class="product-info">
        <p class="category" id="product-category"><span class="skeleton" style="display:inline-block; width:100px; height:1em;"></span></p>
        <h1 id="product-title"><span class="skeleton" style="display:inline-block; width:80%; height:1.2em;"></span></h1>
        <div class="price" id="product-price"><span class="skeleton" style="display:inline-block; width:80px; height:1em;"></span></div>
        
        <div class="description" id="product-description">
          <div class="skeleton" style="width:100%; height:1em; margin-bottom:0.5rem;"></div>
          <div class="skeleton" style="width:90%; height:1em; margin-bottom:0.5rem;"></div>
          <div class="skeleton" style="width:95%; height:1em;"></div>
        </div>
        
        <div class="product-options" id="product-colors-container" style="display: none;">
          <h4>Colors</h4>
          <div class="color-options" id="product-colors">
            <!-- Colors will be loaded here -->
          </div>
        </div>
        
        <button class="add-to-cart-large" id="add-to-cart-main">Add to Cart</button>
      </div>
    </div>
  </main>

  <!-- Footer (Simplified for brevity, copying structure from shop) -->
  <footer class="footer" id="footer">
    <div class="footer-grid">
      <div class="footer-brand">
        <div class="footer-logo">AYHIRA</div>
        <div class="footer-tagline">by A&amp;T</div>
        <p>Where Elegance Meets Tradition.</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Ayhira by A&amp;T. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="script.js"></script>
  
  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <!-- Product Detail Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize Swiper
      let swiper = new Swiper(".mySwiper", {
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        loop: true,
        grabCursor: true,
      });

      // Get product slug from URL
      const urlParams = new URLSearchParams(window.location.search);
      const productSlug = urlParams.get('product');

      if (!productSlug) {
        document.getElementById('product-title').innerHTML = 'Product Not Found';
        document.getElementById('product-description').innerHTML = 'Please return to the shop and select a valid product.';
        return;
      }

      // Fetch product data from Sanity
      const PROJECT_ID = 'sc8k5yfq';
      const DATASET = 'production';
      // Fetch matching product by slug, including gallery URLs and colors array
      const query = encodeURIComponent(`*[_type == "product" && slug.current == "${productSlug}"][0]{
        name, 
        price, 
        category, 
        description, 
        colors, 
        "galleryUrls": gallery[].asset->url
      }`);
      const url = `https://${PROJECT_ID}.api.sanity.io/v2023-05-03/data/query/${DATASET}?query=${query}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          const product = data.result;
          
          if (!product) {
            document.getElementById('product-title').innerHTML = 'Product Not Found';
            document.getElementById('product-description').innerHTML = '';
            return;
          }

          // Populate Basic Info
          document.getElementById('breadcrumb-product-name').textContent = product.name;
          document.getElementById('product-title').textContent = product.name;
          document.getElementById('product-category').textContent = product.category || 'Uncategorized';
          document.getElementById('product-price').textContent = 'Rs. ' + (product.price ? product.price.toLocaleString() : '0');
          document.getElementById('product-description').textContent = product.description || 'No description available.';

          // Populate Colors
          if (product.colors && product.colors.length > 0) {
            const colorsContainer = document.getElementById('product-colors-container');
            const colorsDiv = document.getElementById('product-colors');
            colorsContainer.style.display = 'block';
            
            product.colors.forEach((color, index) => {
              const btn = document.createElement('button');
              btn.className = 'color-chip' + (index === 0 ? ' active' : '');
              btn.textContent = color;
              btn.addEventListener('click', function() {
                document.querySelectorAll('.color-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
              });
              colorsDiv.appendChild(btn);
            });
          }

          // Populate Gallery
          const galleryWrapper = document.getElementById('product-gallery-wrapper');
          galleryWrapper.innerHTML = '';
          
          if (product.galleryUrls && product.galleryUrls.length > 0) {
            product.galleryUrls.forEach(url => {
              const slide = document.createElement('div');
              slide.className = 'swiper-slide';
              slide.innerHTML = \`<img src="\${url}" alt="\${product.name}">\`;
              galleryWrapper.appendChild(slide);
            });
          } else {
            const slide = document.createElement('div');
            slide.className = 'swiper-slide';
            slide.innerHTML = \`<img src="https://via.placeholder.com/600x800?text=No+Image" alt="\${product.name}">\`;
            galleryWrapper.appendChild(slide);
          }

          // Re-initialize swiper after adding DOM elements
          swiper.destroy();
          swiper = new Swiper(".mySwiper", {
            navigation: {
              nextEl: ".swiper-button-next",
              prevEl: ".swiper-button-prev",
            },
            pagination: {
              el: ".swiper-pagination",
              clickable: true,
            },
            loop: true,
            grabCursor: true,
          });

        })
        .catch(err => {
          console.error('Error fetching product detail:', err);
          document.getElementById('product-title').innerHTML = 'Error Loading Product';
        });

      // Add to cart main button logic
      document.getElementById('add-to-cart-main').addEventListener('click', function() {
        const cartCount = document.getElementById('cart-count');
        cartCount.textContent = parseInt(cartCount.textContent || 0, 10) + 1;
        
        const originalText = this.textContent;
        this.textContent = 'Added to Cart ✓';
        this.style.backgroundColor = 'var(--color-gold)';
        
        setTimeout(() => {
          this.textContent = originalText;
          this.style.backgroundColor = 'var(--color-text)';
        }, 2000);
      });
    });
  </script>
</body>
</html>
